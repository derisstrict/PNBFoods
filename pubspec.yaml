name: pnbfoods
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  intl: ^0.20.2
  timeago: ^3.7.1
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.2.2
  http: ^1.6.0
  dio: ^5.9.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/img/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Light.ttf
          weight: 200 
        - asset: fonts/Poppins-Medium.ttf 
          weight: 500  
        - asset: fonts/Poppins-Italic.ttf
          style: italic  
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700  
        - asset: fonts/Poppins-Black.ttf
          weight: 900   
